<svg width="440" height="210" viewBox="0 0 440 210" fill="none"
     xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GitHub Activity">
  <style>
    .f { font-family: ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Noto Sans,Helvetica,Arial,sans-serif; }
    .t { font-size: 13px; font-weight: 600; fill: #4493f8; letter-spacing: .01em; }
    .n { font-size: 21px; font-weight: 600; fill: #f0f6fc; }
    .l { font-size: 10px; font-weight: 500; fill: #9198a1;
         letter-spacing: .07em; text-transform: uppercase; }
    .s { font-size: 10.5px; fill: #9198a1; }
    .k { font-size: 11.5px; font-weight: 500; fill: #f0f6fc; }
  </style>
  <rect x="0.5" y="0.5" width="439" height="209" rx="10"
        fill="#0d1117" stroke="#3d444d"/>
  <g class="f">
    <text x="24" y="32" class="t">GitHub Activity</text>
    <line x1="24" y1="44" x2="416" y2="44" stroke="#3d444d"/>
    <text x="24" y="82" class="n">4.5k</text>
    <text x="24" y="97" class="l">Contributions</text>
    <text x="158" y="82" class="n">38</text>
    <text x="158" y="97" class="l">Stars Earned</text>
    <text x="292" y="82" class="n">657</text>
    <text x="292" y="97" class="l">Commits</text>
    <text x="24" y="138" class="n">8</text>
    <text x="24" y="153" class="l">Pull Requests</text>
    <text x="158" y="138" class="n">24</text>
    <text x="158" y="153" class="l">Repositories</text>
    <text x="292" y="138" class="n">1</text>
    <text x="292" y="153" class="l">Day Streak</text>
    <text x="24" y="190" class="s">54 followers · 3 repositories contributed to</text>
  </g>
</svg>
